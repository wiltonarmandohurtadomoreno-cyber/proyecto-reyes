
<div id="carruselPrincipal" class="carousel slide carrusel-creativo" data-bs-ride="carousel">

    <!-- Indicadores -->

        </div>

    </div>


    <!-- ANTERIOR -->
    <button class="carousel-control-prev"
            type="button"
            data-bs-target="#carruselPrincipal"
            data-bs-slide="prev">

            ‹
        </span>

    </button>


    <!-- SIGUIENTE -->
    <button class="carousel-control-next"
            type="button"
            data-bs-target="#carruselPrincipal"
            data-bs-slide="next">

        <span class="flecha">

        </span>

    </button>

</div>
