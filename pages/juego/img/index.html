<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Página Web</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <div class="logo">
            <img src="main/img/logo.png" alt="Logo">
            <h2>Mi Sitio Web</h2>
        </div>

        <nav>
            <a href="#">Inicio</a>
            <a href="#">Servicios</a>
            <a href="#">Galería</a>
            <a href="#">Contacto</a>
        </nav>
    </header>

    <section class="hero">
        <h1>Bienvenido</h1>
        <p>Aprendiendo HTML, CSS y JavaScript.</p>

        <button id="btn">Comenzar</button>
    </section>

    <section class="cards">

        <div class="card">
            <h3>HTML</h3>
            <p>Crea la estructura de la página.</p>
        </div>

        <div class="card">
            <h3>CSS</h3>
            <p>Da color y estilo al sitio web.</p>
        </div>

        <div class="card">
            <h3>JavaScript</h3>
            <p>Agrega funciones e interactividad.</p>
        </div>

    </section>

    <footer>
        <p>© 2026 Mi Página Web</p>
    </footer>

    <script src="main/js/script.js"></script>

</body>

</html>
